name: Deploy to GitHub Pages

# Ships the LCE static site (index.html + the ES modules) to GitHub Pages on
# every push to main — the per-phase deploy. The pure core is dependency-free
# and runs directly in the browser, so there is no build step.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'            # the repo root: index.html, web/, src/
      - id: deployment
        uses: actions/deploy-pages@v4
